name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup

      # Turborepo stores task results in .turbo/cache. Restoring the newest entry lets unchanged
      # packages skip their tasks; the key is unique per commit so each run saves its own results.
      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Check formatting
        run: pnpm format:check

      - name: Test the release guard
        run: pnpm test:tools

      - name: Check that apps are not publishable
        run: pnpm check:release

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

      - name: Check published package shape
        run: pnpm turbo run check-package

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repo with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the scan needs every commit
          persist-credentials: false

      # The gitleaks action only scans the commits in each push, and its first push failed because
      # the range starts at the root commit. The CLI scans the whole history every time instead.
      # The download is pinned by checksum (the project's published sha256 for this release).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file gitleaks.tar.gz gitleaks

      - name: Scan the full git history
        run: ./gitleaks git --redact --verbose --exit-code 2 .
