name: Set up the workspace
description: Install pnpm, Node (version from .nvmrc) and the locked dependencies. Run after checkout.

inputs:
  cache:
    description: Cache the pnpm store. Turn it off in jobs that publish, to avoid cache poisoning.
    default: 'true'

runs:
  using: composite
  steps:
    # pnpm's version comes from the "packageManager" field in package.json.
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        package-manager-cache: false

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
